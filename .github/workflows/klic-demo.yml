# tools/klic-demo: KLIC hot-pixel demo.  pytest pins every printed number,
# including the Shapely/GEOS version, so a GEOS change fails here instead of
# passing silently.  Builds the Rocq-extracted kernel with a stock OCaml
# compiler (the extraction itself is checked for freshness in ci.yml's
# rocq-flocq job).  JTS (java+maven), NTS (dotnet) and PostGIS (docker) are
# preinstalled on ubuntu-latest, so the live stock tests run here too; each
# skips with a reason if its toolchain is missing.
name: klic-demo

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/klic-demo/**'
      - 'theories-flocq/HotPixel_Q_exec.v'
      - '.github/workflows/klic-demo.yml'
  push:
    branches: [main]
    paths:
      - 'tools/klic-demo/**'
      - 'theories-flocq/HotPixel_Q_exec.v'
      - '.github/workflows/klic-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klic-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: klic-demo pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/klic-demo/requirements.txt

      - name: Install OCaml (stock compiler only; Ubuntu 24.04 has no ocaml-nox)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml

      - name: Install requirements
        run: pip install -r tools/klic-demo/requirements.txt

      - name: Build extracted kernel
        run: bash tools/klic-demo/ocaml/build.sh

      - name: Toolchain versions
        run: |
          python -c "import shapely; print('Shapely', shapely.__version__, 'GEOS', shapely.geos_version_string)"
          ocamlopt -version; java -version 2>&1 | head -1 || true; dotnet --version || true; docker --version || true

      - name: Demo (prints every number, with versions)
        run: python tools/klic-demo/demo.py --no-png

      - name: pytest tools/klic-demo
        run: pytest -v tools/klic-demo
