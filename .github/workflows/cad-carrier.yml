# CAD carrier extractor. Runs on pull_request, push to main, and merge_group.
# Independent of the Rocq jobs in ci.yml: no needs: on those workflows,
# and they are not modified.
#
# `changes` sets `cad` when tools/cad/** or this file changed, including
# deletions. Pull requests use the GitHub file list (pull-requests: read
# on this job only), so a fork PR still runs the gate; pytest and schema
# skip unless those paths changed. Push and merge_group use git, so they
# check out first. dorny/paths-filter v4.0.3 reads merge_group base_sha
# and head_sha, so cad is not forced on.
# The check to require in branch protection is the `cad-carrier` job.

name: cad-carrier

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cad-carrier-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cad: ${{ steps.filter.outputs.cad }}
    steps:
      # Push and merge_group detect changes with git. Pull requests use the API.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name != 'pull_request'

      # v4.0.3. Default matching includes added, modified, and deleted paths.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            cad:
              - 'tools/cad/**'
              - '.github/workflows/cad-carrier.yml'

  pytest:
    name: pytest
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cad/requirements.txt

      - name: Install FreeType
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype6

      - name: Install tools/cad requirements
        run: pip install -r tools/cad/requirements.txt

      - name: pytest tools/cad
        run: pytest tools/cad

  schema:
    name: schema
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cad/requirements.txt

      - name: Install tools/cad requirements
        run: pip install -r tools/cad/requirements.txt

      - name: Validate extractor output and the tolerance conversion
        run: |
          out="${RUNNER_TEMP}/cad-records"
          python3 tools/cad/export_fixture_json.py "$out"
          python3 -m check_jsonschema --schemafile tools/cad/carrier.schema.json "$out"/*.json
          python3 -m check_jsonschema --schemafile tools/cad/carrier.schema.json tools/cad/fixtures/truetype_e.json
          python3 -m check_jsonschema --schemafile tools/cad/tolerance.schema.json tools/cad/tolerance.json
          python3 -m check_jsonschema --schemafile tools/cad/survey/survey.schema.json tools/cad/survey/dxf.json tools/cad/survey/dgn.json tools/cad/survey/font.json

  cad-carrier:
    name: cad-carrier
    needs: [changes, pytest, schema]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pass only when changes succeeded and tests succeeded or were skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          SCHEMA_RESULT: ${{ needs.schema.result }}
        run: |
          printf 'changes=%s pytest=%s schema=%s\n' "$CHANGES_RESULT" "$PYTEST_RESULT" "$SCHEMA_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes result is $CHANGES_RESULT"
            exit 1
          fi
          for result in "$PYTEST_RESULT" "$SCHEMA_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "test result is $result"; exit 1 ;;
            esac
          done
